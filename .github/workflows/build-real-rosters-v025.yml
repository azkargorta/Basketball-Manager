name: Build real roster snapshot v0.25

on:
  workflow_dispatch:
  push:
    branches:
      - v025-roster-action-center
    paths:
      - tools/build_real_rosters.py
      - tools/build_real_rosters_reader.py
      - tools/debug_reader_sample.py
      - .github/workflows/build-real-rosters-v025.yml

concurrency:
  group: v025-real-rosters
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-rosters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v025-roster-action-center
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install builder dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Inspect reader response
        run: python tools/debug_reader_sample.py

      - name: Build current roster snapshot
        run: python tools/build_real_rosters_reader.py

      - name: Commit generated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/real_rosters_2026_27.js REAL_ROSTERS_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh real roster snapshot 2026-09-02"
            git push origin HEAD:v025-roster-action-center
          fi
