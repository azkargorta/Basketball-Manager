name: Build real rosters for main
on:
  push:
    branches: [main]
    paths:
      - 'tools/build_real_rosters_thesportsdb.py'
      - '.github/workflows/build-real-rosters-main.yml'
  workflow_dispatch:

concurrency:
  group: build-real-rosters-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install requests
      - name: Build real roster pack
        run: python tools/build_real_rosters_thesportsdb.py
      - name: Commit roster data
        run: |
          git config user.name "Basketball GM roster bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/real-rosters-2026-27.generated.js REAL_ROSTERS_REPORT.json
          if git diff --cached --quiet; then
            echo "No roster changes"
          else
            git commit -m "Generate real initial rosters 2026-27 [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
